<title>Paint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="開いているページの上にそのまま描ける、低遅延のブックマークレット製ペイントツール">
<style>
:root {
  --bg: #ffffff;
  --ink: #1d2026;
  --soft: #6b717c;
  --line: #e4e6ea;
  --fill: #f4f5f7;
  --accent: #d7362d;
  --on-accent: #ffffff;
  --font: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --ink: #e8e9ee; --soft: #9399a3; --line: #2a2d34; --fill: #1e2126; --accent: #ff6b5d; --on-accent: #1c0c0a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --ink: #e8e9ee; --soft: #9399a3; --line: #2a2d34; --fill: #1e2126; --accent: #ff6b5d; --on-accent: #1c0c0a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); }
h1, h2, p, ol, ul, fieldset { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 0 0.4em;
  font: 600 0.8em/1.6 var(--mono); text-align: center;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--bg);
}
/* 上のバー: ブックマークにするボタンは、どこまでスクロールしても手元にある */
.top {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: 8px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top .bm { margin-right: auto; }
.bm {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px 8px 12px; border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
  font-weight: 600; text-decoration: none; cursor: grab;
}
.bm:active { cursor: grabbing; }
.bm svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn {
  font: 500 14px/1 var(--font); padding: 9px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
.btn:hover { background: var(--fill); }
.page {
  max-width: 680px; margin: 0 auto;
  padding: 40px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 48px;
}
section { display: grid; gap: 14px; min-width: 0; }
h2 { font-size: 13px; font-weight: 600; color: var(--soft); }
textarea {
  width: 100%; min-height: 6em; padding: 10px;
  font: 12px/1.5 var(--mono); color: var(--ink); background: var(--fill);
  border: 1px solid var(--line); border-radius: 8px; word-break: break-all;
}
.steps { padding-left: 1.3em; display: grid; gap: 6px; }
.steps li::marker { color: var(--soft); }
/* 設定: 名前と値の行を並べる。説明の文は置かない */
.prefs { display: grid; border: 1px solid var(--line); border-radius: 12px; }
.row { display: grid; grid-template-columns: 7em minmax(0, 1fr); align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.prefs > .row:first-child { border-top: 0; }
.row > .k { font-weight: 500; }
fieldset { border: 0; padding: 0; min-width: 0; }
.prefs legend { float: left; padding: 0; font-weight: 500; }
fieldset.row > legend + * { grid-column: 2; }
.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.swatches input[type=radio] { appearance: none; -webkit-appearance: none; margin: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px #0002; cursor: pointer; }
.swatches input[type=radio]:checked { outline: 2px solid var(--ink); outline-offset: 2px; }
input[type=color] { width: 36px; height: 24px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; }
.sliders { display: grid; gap: 4px; }
.slider { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 3em; align-items: center; gap: 10px; }
.slider input { width: 100%; margin: 0; accent-color: var(--accent); }
.slider output { font: 13px/1 var(--mono); text-align: right; color: var(--soft); }
.choices { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.choices label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.choices input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); justify-self: start; }
/* 入り・切りはスイッチの形（チェックボックスのまま見た目だけ。ツールのメニューのスイッチと同じ形） */
.check { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.check input { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 38px; height: 22px; margin: 0; border-radius: 11px; background: var(--line); cursor: pointer; transition: background .15s; }
.check input::before { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0004; transition: transform .15s; }
.check input:checked { background: var(--accent); }
.check input:checked::before { transform: translateX(16px); }
details { border-top: 1px solid var(--line); }
summary { padding: 12px 16px; font-weight: 500; cursor: pointer; color: var(--soft); }
details > .row:first-of-type, details > .check:first-of-type { border-top-color: var(--line); }
.gdev.off { opacity: 0.5; }
.foot { display: flex; padding: 12px 16px; border-top: 1px solid var(--line); }
/* 操作の一覧（build.mjs が HELP から書き出す） */
.help { display: grid; gap: 24px; }
.help section { gap: 6px; }
.help h3 { margin: 0; font-size: 14px; font-weight: 600; }
.keys { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.keys li { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 12px; align-items: baseline; }
.keys .k { white-space: nowrap; }
.keys li.t .k { white-space: normal; font-weight: 500; }
.bottom { color: var(--soft); font-size: 13px; }
@media (max-width: 480px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  fieldset.row > legend + * { grid-column: 1; }
  .keys li { grid-template-columns: 6.5em minmax(0, 1fr); gap: 8px; }
  .keys .k { white-space: normal; }
  .keys li.t { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .top .btn { padding: 9px 10px; }
}
</style>
<header class="top">
  <h1 class="sr">Paint</h1>
  <a id="bm" class="bm" href="%%BOOKMARKLET_HREF%%"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.4L16 4.8a2 2 0 0 1 2.9 0l.3.3a2 2 0 0 1 0 2.9L8.4 18.8zM14 7l3 3"/></svg>Paint</a>
  <button id="try" class="btn" type="button">試す</button>
  <button id="copy" class="btn" type="button">コピー</button>
</header>
<main class="page">
  <section id="install" aria-labelledby="install-h">
    <h2 id="install-h">入れ方</h2>
    <ol class="steps">
      <li>ブックマークバーを出す <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd>（Mac は <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd>）</li>
      <li>「Paint」をバーへドラッグ</li>
      <li>描きたいページで押す</li>
    </ol>
    <p>スマホでは「コピー」して、ブックマークの URL に貼る</p>
    <textarea id="code" readonly hidden aria-label="ブックマークレットのコード"></textarea>
  </section>
  <section id="defaults" aria-labelledby="pref-h">
    <h2 id="pref-h">設定</h2>
    <form id="prefs" class="prefs" onsubmit="return false">
      <fieldset class="row">
        <legend>色</legend>
        <div class="swatches" id="p-colors">
          <input type="color" id="p-custom" aria-label="その他の色">
        </div>
      </fieldset>
      <fieldset class="row">
        <legend>太さ</legend>
        <div class="sliders">
          <label class="slider"><span>ペン</span><input type="range" id="p-pen" min="1" max="40"><output for="p-pen"></output></label>
          <label class="slider"><span>蛍光ペン</span><input type="range" id="p-marker" min="4" max="80"><output for="p-marker"></output></label>
          <label class="slider"><span>消しゴム</span><input type="range" id="p-eraser" min="4" max="100"><output for="p-eraser"></output></label>
          <label class="slider"><span>文字</span><input type="range" id="p-text" min="10" max="80"><output for="p-text"></output></label>
        </div>
      </fieldset>
      <label class="row"><span class="k">道具</span>
        <select id="p-tool">
          <option value="pen">ペン</option><option value="marker">蛍光ペン</option><option value="text">文字</option><option value="select">選択</option>
        </select>
      </label>
      <fieldset class="row">
        <legend>ツールバー</legend>
        <div class="choices" id="p-bar">
          <label><input type="radio" name="bar" value="top">上</label>
          <label><input type="radio" name="bar" value="top-left">左上</label>
          <label><input type="radio" name="bar" value="top-right">右上</label>
          <label><input type="radio" name="bar" value="bottom">下</label>
        </div>
      </fieldset>
      <fieldset class="row">
        <legend>見た目</legend>
        <div class="choices" id="p-theme" role="radiogroup" aria-label="ツールバーの色">
          <label><input type="radio" name="theme" value="light">明るい</label>
          <label><input type="radio" name="theme" value="dark">暗い</label>
          <label><input type="radio" name="theme" value="custom" aria-label="好きな色"><input type="color" id="p-tcolor" value="#3a4a5c" aria-label="ツールバーの好きな色"></label>
        </div>
      </fieldset>
      <fieldset class="row">
        <legend>版</legend>
        <div class="choices" id="p-ui" role="radiogroup" aria-label="最初に出す版">
          <label><input type="radio" name="ui" value="main">本家</label>
          <label><input type="radio" name="ui" value="cp2">Simple Preview</label>
        </div>
      </fieldset>
      <label class="check">ガラス<input type="checkbox" role="switch" id="p-glass"></label>
      <label class="check">文字に触れる<input type="checkbox" role="switch" id="p-touch"></label>
      <label class="check">ペンと図形の種類を 1 回で出す<input type="checkbox" role="switch" id="p-once"></label>
      <label class="check">動かしてもパネルを閉じない<input type="checkbox" role="switch" id="p-keep"></label>
      <label class="check">電卓<input type="checkbox" role="switch" id="p-calc"></label>
      <details>
        <summary>開発用</summary>
        <label class="check">ツールに開発用の項目を出す<input type="checkbox" role="switch" id="p-dev"></label>
        <div class="gdev" id="p-gdev">
          <fieldset class="row">
            <legend>ぼかし方</legend>
            <div class="choices" id="p-mode" role="radiogroup" aria-label="ぼかし方">
              <label><input type="radio" name="mode" value="gauss">ガウス</label>
              <label><input type="radio" name="mode" value="plain">ふつう</label>
            </div>
          </fieldset>
          <fieldset class="row">
            <legend>ガラス</legend>
            <div class="sliders">
              <label class="slider"><span>ぼかし</span><input type="range" id="p-blur" min="0" max="40"><output for="p-blur"></output></label>
              <label class="slider"><span>地</span><input type="range" id="p-tint" min="30" max="95"><output for="p-tint"></output></label>
              <label class="slider"><span>彩度</span><input type="range" id="p-sat" min="100" max="300"><output for="p-sat"></output></label>
            </div>
          </fieldset>
        </div>
        <fieldset class="row">
          <legend>予測</legend>
          <div class="choices" id="p-ppred" role="radiogroup" aria-label="予測の方法">
            <label><input type="radio" name="ppred" value="own">曲がりに沿う</label>
            <label><input type="radio" name="ppred" value="chrome">ブラウザ</label>
          </div>
        </fieldset>
        <fieldset class="row">
          <legend>予測の長さ</legend>
          <div class="choices" id="p-plen" role="radiogroup" aria-label="予測の長さ">
            <label><input type="radio" name="plen" value="0.75">3/4 フレーム</label>
            <label><input type="radio" name="plen" value="1">1 フレーム</label>
            <label><input type="radio" name="plen" value="0.5">1/2 フレーム</label>
          </div>
        </fieldset>
      </details>
      <div class="foot"><button type="button" id="p-reset" class="btn">最初の状態に戻す</button></div>
    </form>
  </section>
  <section id="usage" aria-labelledby="keys-h">
    <h2 id="keys-h">操作</h2>
    <div class="help">
%%HELP%%
    </div>
  </section>
  <footer class="bottom"><a href="https://github.com/shutsuruwork-afk/paint-tool">GitHub</a> · MIT</footer>
</main>
<script>
function runPaint() {%%INLINE_CODE%%}
(() => {
  const bm = document.getElementById('bm');
  // ---- デフォルトの設定: 選んだ既定をブックマークレットのコードに埋め込む ----
  // 組み込みの既定（src/paint.js の PALETTE と CFG に合わせる。テストで一致を確かめている）
  const PALETTE = ['#111111', '#ffffff', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];
  const BUILTIN = { color: '#e53935', tool: 'pen', size: { pen: 4, marker: 24, eraser: 32, text: 24 }, bar: 'top', touchText: true, calc: false, pickOnce: false, keepPanels: false, glass: true, theme: 'light', blurMode: 'gauss', blur: 18, tint: 80, sat: 200, dev: false, ui: 'main', ppred: 'own', plen: 0.75 };
  const BASE = bm.getAttribute('href'); // 既定の入っていないブックマークレット
  const KEY = 'paint-defaults';
  const $ = id => document.getElementById(id);
  const colorsEl = $('p-colors'), custom = $('p-custom');
  PALETTE.forEach((c, i) => {
    const r = document.createElement('input');
    r.type = 'radio'; r.name = 'color'; r.value = c;
    r.setAttribute('aria-label', '色 ' + (i + 1));
    r.style.setProperty('--c', c);
    colorsEl.insertBefore(r, colorsEl.lastElementChild);
  });
  const sizes = ['pen', 'marker', 'eraser', 'text'];
  // 選択肢の組とスイッチ（フォームの id → 設定の名前）
  const RADIOS = [['p-bar', 'bar'], ['p-mode', 'blurMode'], ['p-ui', 'ui'], ['p-ppred', 'ppred'], ['p-plen', 'plen']];
  const SWITCHES = [['p-touch', 'touchText'], ['p-calc', 'calc'], ['p-once', 'pickOnce'], ['p-keep', 'keepPanels'], ['p-glass', 'glass'], ['p-dev', 'dev']];
  // ツールの「デフォルトの変更」から開いたときは、そのブックマークの既定が #defaults=… で届くので、それを読み込む
  let fromTool = false;
  let cur = fromHash() || load();
  function fromHash() {
    const m = /^#defaults=(.*)$/.exec(location.hash);
    if (!m) return null;
    let v = null;
    try { v = JSON.parse(decodeURIComponent(m[1])); } catch (_) { }
    try { history.replaceState(null, '', '#defaults'); } catch (_) { }
    if (!v || typeof v !== 'object') return null;
    fromTool = true;
    return merge(v);
  }
  function load() {
    let v = null;
    try { v = JSON.parse(localStorage.getItem(KEY)); } catch (_) { }
    return merge(v);
  }
  function merge(v) {
    const d = JSON.parse(JSON.stringify(BUILTIN));
    if (v && typeof v === 'object') {
      if (typeof v.color === 'string') d.color = v.color;
      if (typeof v.tool === 'string') d.tool = v.tool;
      if (v.size) for (const k of sizes) if (+v.size[k] > 0) d.size[k] = +v.size[k];
      if (typeof v.bar === 'string') d.bar = v.bar;
      if (typeof v.touchText === 'boolean') d.touchText = v.touchText;
      if (typeof v.calc === 'boolean') d.calc = v.calc;
      if (typeof v.pickOnce === 'boolean') d.pickOnce = v.pickOnce;
      if (typeof v.keepPanels === 'boolean') d.keepPanels = v.keepPanels;
      if (typeof v.glass === 'boolean') d.glass = v.glass;
      if (v.theme === 'light' || v.theme === 'dark' || /^#[0-9a-f]{6}$/i.test(v.theme)) d.theme = v.theme.toLowerCase();
      if (typeof v.dev === 'boolean') d.dev = v.dev;
      if (v.blurMode === 'gauss' || v.blurMode === 'plain') d.blurMode = v.blurMode;
      if (+v.blur >= 0 && +v.blur <= 40) d.blur = +v.blur;
      if (+v.tint >= 30 && +v.tint <= 95) d.tint = +v.tint;
      if (+v.sat >= 100 && +v.sat <= 300) d.sat = +v.sat;
      if (v.ui === 'main' || v.ui === 'cp2') d.ui = v.ui;
      if (v.ppred === 'own' || v.ppred === 'chrome') d.ppred = v.ppred;
      if ([1, 0.75, 0.5].includes(+v.plen)) d.plen = +v.plen;
    }
    return d;
  }
  // 組み込みの既定と違う所だけを渡す（URL を短く保ち、あとで組み込みの既定が変わっても効くように）
  function diff(c) {
    const o = {};
    if (c.color !== BUILTIN.color) o.color = c.color;
    if (c.tool !== BUILTIN.tool) o.tool = c.tool;
    for (const k of sizes) if (c.size[k] !== BUILTIN.size[k]) (o.size || (o.size = {}))[k] = c.size[k];
    for (const k of ['bar', 'touchText', 'calc', 'pickOnce', 'keepPanels', 'glass', 'theme', 'blurMode', 'blur', 'tint', 'sat', 'dev', 'ui', 'ppred', 'plen']) if (c[k] !== BUILTIN[k]) o[k] = c[k];
    return o;
  }
  const enc = s => s.replace(/[%#\s"]/g, ch => encodeURIComponent(ch));
  function hrefFor(o) {
    if (!Object.keys(o).length) return BASE;
    return BASE.replace(/(['"])__PAINT_DEFAULTS__\1/, () => enc(JSON.stringify(JSON.stringify(o))));
  }
  function show() {
    for (const r of colorsEl.querySelectorAll('input[type=radio]')) r.checked = r.value === cur.color;
    custom.value = cur.color;
    for (const k of sizes) { const r = $('p-' + k); r.value = cur.size[k]; r.nextElementSibling.value = cur.size[k]; }
    $('p-tool').value = cur.tool;
    for (const [id, k] of RADIOS) for (const r of document.querySelectorAll(`#${id} input`)) r.checked = r.value === String(cur[k]);
    for (const [id, k] of SWITCHES) $(id).checked = cur[k];
    for (const r of document.querySelectorAll('#p-theme input[type=radio]')) r.checked = r.value === (cur.theme[0] === '#' ? 'custom' : cur.theme);
    if (cur.theme[0] === '#') $('p-tcolor').value = cur.theme;
    for (const k of ['blur', 'tint', 'sat']) { const r = $('p-' + k); r.value = cur[k]; r.nextElementSibling.value = k === 'blur' ? cur[k] + 'px' : cur[k] + '%'; }
    $('p-gdev').classList.toggle('off', !cur.glass);
    const o = diff(cur);
    bm.setAttribute('href', hrefFor(o));
    bm.lastChild.textContent = cur.ui === 'cp2' ? 'Paint Simple' : 'Paint'; // ブックマークの名前で版が分かるように
  }
  // 保存も既定との差分だけにする（あとで組み込みの既定を変えたとき、触っていない所には新しい既定が効く）
  function update() {
    try { localStorage.setItem(KEY, JSON.stringify(diff(cur))); } catch (_) { }
    show();
  }
  colorsEl.addEventListener('change', e => { if (e.target.name === 'color') { cur.color = e.target.value; update(); } });
  custom.addEventListener('input', () => { cur.color = custom.value.toLowerCase(); update(); });
  for (const k of sizes) $('p-' + k).addEventListener('input', e => { cur.size[k] = +e.target.value; update(); });
  $('p-tool').addEventListener('change', e => { cur.tool = e.target.value; update(); });
  for (const [id, k] of RADIOS) $(id).addEventListener('change', e => { cur[k] = k === 'plen' ? +e.target.value : e.target.value; update(); });
  for (const [id, k] of SWITCHES) $(id).addEventListener('change', e => { cur[k] = e.target.checked; update(); });
  $('p-theme').addEventListener('change', e => { if (e.target.name === 'theme') { cur.theme = e.target.value === 'custom' ? $('p-tcolor').value : e.target.value; update(); } });
  $('p-tcolor').addEventListener('input', e => { cur.theme = e.target.value.toLowerCase(); update(); });
  for (const k of ['blur', 'tint', 'sat']) $('p-' + k).addEventListener('input', e => { cur[k] = +e.target.value; update(); });
  $('p-reset').addEventListener('click', () => { cur = JSON.parse(JSON.stringify(BUILTIN)); update(); });
  if (fromTool) {
    update();
    if (cur.dev) document.querySelector('#prefs details').open = true; // 「この見た目をデフォルトに」から来たとき
    $('defaults').scrollIntoView();
  } else show();
  // このページで試すときは eval を使わず、埋め込み版が読む変数で既定を渡す
  const tryPaint = () => {
    window.__paintBookmarkletDefaults = JSON.stringify(diff(cur));
    try { runPaint(); } finally { delete window.__paintBookmarkletDefaults; }
  };

  // このページ上でクリックされたら javascript: URL へ遷移せず、同じコードを直接実行する
  bm.addEventListener('click', e => { e.preventDefault(); tryPaint(); });
  document.getElementById('try').addEventListener('click', () => tryPaint());

  const copyBtn = document.getElementById('copy');
  const area = document.getElementById('code');
  let t = 0;
  copyBtn.addEventListener('click', () => {
    const code = bm.getAttribute('href');
    const done = () => { copyBtn.textContent = 'コピーしました'; clearTimeout(t); t = setTimeout(() => { copyBtn.textContent = 'コピー'; }, 2500); };
    // クリップボードが使えなければ、選んだ状態のコードを出す
    const manual = () => { area.hidden = false; area.value = code; area.focus(); area.select(); };
    try { navigator.clipboard.writeText(code).then(done, manual); } catch (_) { manual(); }
  });

})();
</script>
